name: KChart library and HTML View

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kchart.yml'
      - 'packages/kchart/**'
      - 'skills/html-view/**'
      - 'docs/**'
      - 'README*.md'
  pull_request:
    paths:
      - '.github/workflows/kchart.yml'
      - 'packages/kchart/**'
      - 'skills/html-view/**'
      - 'docs/**'
      - 'README*.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TMPDIR: /var/tmp
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/kchart/package-lock.json
      - run: npm ci
        working-directory: packages/kchart
      - run: npm test
        working-directory: packages/kchart
      # Vitest's global setup builds dist/ before the library tests run.
      - run: npm run vendor -- --check
        working-directory: packages/kchart
      - name: Test HTML View with Chrome
        run: |
          export CHROME_PATH="$(command -v google-chrome)"
          "$CHROME_PATH" --version
          node --test skills/html-view/scripts/tests/*.test.mjs
      # Every Mermaid example the repository publishes must parse in real Mermaid; ZenUML needs Mermaid's plugin.
      - name: Parse published Mermaid examples with Mermaid 12.3.0
        run: |
          export CHROME_PATH="$(command -v google-chrome)"
          node packages/kchart/conformance/repo-examples.mjs > "$RUNNER_TEMP/examples.json"
          node packages/kchart/conformance/validate.mjs "$RUNNER_TEMP/examples.json" --allow-plugins > "$RUNNER_TEMP/report.json" \
            || { cat "$RUNNER_TEMP/report.json"; exit 1; }
