name: Release KChart

on:
  push:
    tags: ['kchart-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kchart
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # 不要传 registry-url：setup-node 会写入 _authToken=${NODE_AUTH_TOKEN}，
      # 并把 NODE_AUTH_TOKEN 默认成占位符，npm 于是按令牌认证、不走 OIDC，
      # 发布会被注册表当成无权访问而返回 404。
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # Trusted publishing (OIDC, no stored token) needs npm >= 11.5.1.
      - run: npm install --global npm@11
      - name: Verify tag matches package version
        run: |
          node --input-type=module -e 'import pkg from "./package.json" with { type: "json" }; if (process.env.GITHUB_REF_NAME !== `kchart-v${pkg.version}`) throw new Error(`Tag must be kchart-v${pkg.version}`);'
      - run: npm ci
      - run: npm test
      - run: npm publish
