name: Release KChart

on:
  push:
    tags: ['kchart-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/kchart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@11
      - name: Verify tag matches package version
        run: node --input-type=module -e 'import pkg from "./package.json" with { type: "json" }; if (process.env.GITHUB_REF_NAME !== `kchart-v${pkg.version}`) throw new Error(`Tag must be kchart-v${pkg.version}`);'
      - run: npm ci
      - run: npm test
      - run: npm publish
