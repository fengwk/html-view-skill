<header class="doc-head">
  <h1>{{title}}</h1>
  <p class="doc-lede" data-todo>一两句话：在什么时间交付什么。</p>
</header>

<section class="summary" aria-labelledby="summary-title">
  <h2 class="summary-title" id="summary-title">先看结论</h2>
  <ul>
    <li data-todo>交付时间与关键里程碑。</li>
  </ul>
  <div class="decide">
    <h3 class="summary-title">需要你决定</h3>
    <ol>
      <li data-todo>需要拍板的事，写明选项和建议；没有就删掉整个「需要你决定」。</li>
    </ol>
  </div>
</section>

<div class="doc-body">
  <section>
    <h2 id="sec-goal">目标与范围</h2>
    <p data-todo>交付物与不交付的内容。</p>
  </section>

  <section>
    <h2 id="sec-milestones">里程碑</h2>
    <ol class="timeline">
      <li data-k="neutral" data-todo><span class="tl-date">日期</span><b class="tl-title">里程碑的结果</b><span class="tl-desc">一句说明</span></li>
    </ol>
  </section>

  <section>
    <h2 id="sec-tasks">任务与负责人</h2>
    <table>
      <thead><tr><th>任务</th><th>负责人</th><th>依赖</th><th>截止</th><th>状态</th></tr></thead>
      <tbody>
        <tr data-todo><td>…</td><td>…</td><td>…</td><td class="num-font">…</td><td><span class="tag" data-k="neutral">未开始</span></td></tr>
      </tbody>
    </table>
  </section>

  <section>
    <h2 id="sec-risk">依赖与风险</h2>
    <p data-todo>外部依赖、就绪条件、风险与应对。</p>
  </section>

  <section>
    <h2 id="sec-open">待确认事项</h2>
    <table>
      <thead><tr><th>事项</th><th>需要谁确认</th><th>影响</th><th>确认前的默认处理</th></tr></thead>
      <tbody>
        <tr data-todo><td>…</td><td>…</td><td>…</td><td>…</td></tr>
      </tbody>
    </table>
  </section>
</div>
