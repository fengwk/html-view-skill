<header class="doc-head">
  <h1>{{title}}</h1>
  <p class="doc-lede" data-todo>一句话说清提案或进展。</p>
</header>

<section class="summary" aria-labelledby="summary-title">
  <h2 class="summary-title" id="summary-title">先看结论</h2>
  <ul>
    <li data-todo>提案或进展的要点。</li>
  </ul>
  <div class="decide">
    <h3 class="summary-title">需要你决定</h3>
    <ol>
      <li data-todo>需要拍板的事，写明选项和建议；没有就删掉整个「需要你决定」。</li>
    </ol>
  </div>
</section>

<div class="doc-body">
  <section>
    <h2 id="sec-why">为什么现在做</h2>
    <div class="grid" data-cols="3">
      <div class="card" data-todo><b class="card-title">要点</b><p>一两句话。</p></div>
    </div>
  </section>

  <section>
    <h2 id="sec-how">方案</h2>
    <p data-todo>方案要点，配一张图或步骤。</p>
  </section>

  <section>
    <h2 id="sec-plan">投入与节奏</h2>
    <p data-todo>人力与周期，用时间线或简表；进展同步时删掉这一节。</p>
  </section>

  <section>
    <h2 id="sec-measure">怎么验收</h2>
    <p data-todo>能检查的验收标准。</p>
  </section>
</div>
